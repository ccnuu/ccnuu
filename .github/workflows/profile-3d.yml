name: GitHub-Profile-3D-Contrib
# https://github.com/yoshi389111/github-profile-3d-contrib/tree/main
on:
  schedule: # 03:00 JST == 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.CCNUU_TOKEN }}
          USERNAME: ccnuu
      - name: Commit & Push
        run: |
          git config user.name ccnuu
          git config user.email cy.arctique@gmail.com
          git add -A .
          if git commit -m "generated"; then
            git push
          fi
